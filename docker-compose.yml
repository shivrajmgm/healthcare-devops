version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: healthcare-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: healthcare_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: healthcare-api
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/healthcare_db
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata: